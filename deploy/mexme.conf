server {
    listen 10.214.49.72:3003 ssl;
    server_name 10.214.49.72;


    error_log /home/debian/MexMe/logs/nginx/error.log error;
    access_log /home/debian/MexMe/logs/nginx/access.log main;

    ssl_certificate /home/debian/TheBirders/nginx/certs/certificate.pem;
    ssl_certificate_key /home/debian/TheBirders/nginx/certs/private.key;

    allow 172.20.1.3/32;
    allow 172.20.1.7/32;
    allow 172.20.1.8/32;
    allow 172.20.1.9/32;
    allow 192.168.0.202/32;
    deny all;  

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessari solo se l'app usa WebSocket / Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}