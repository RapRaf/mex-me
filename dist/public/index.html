<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MexMe - Clipboard</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100vh;
            font-family: Arial, sans-serif; display: flex; flex-direction: column;
            overflow: hidden; background-color: #eef2f5;
        }

        .text-section { flex: 2; display: flex; }
        textarea { width: 100%; height: 100%; padding: 20px; font-size: 18px; border: none; outline: none; resize: none; box-sizing: border-box; }

        .toolbar { background: #2c3e50; color: white; padding: 10px 20px; display: flex; align-items: center; gap: 15px; }

        .files-section {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-wrap: wrap; gap: 20px; align-content: flex-start;
        }

        /* CARD STANDARD - Leggermente ingrandita per contenere le statistiche */
        .file-card {
            background: white; border-radius: 8px; width: 130px; height: 140px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center; text-decoration: none; color: #333; transition: transform 0.2s;
        }
        .file-card:hover { transform: translateY(-5px); }
        .file-card .icon { font-size: 40px; margin-bottom: 5px; }
        .file-card .name { font-size: 11px; word-break: break-all; padding: 0 5px; }
        
        .delete-btn {
            position: absolute; top: -8px; right: -8px; background: #e74c3c; color: white; border-radius: 50%;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; font-size: 14px; border: 2px solid white; z-index: 10;
        }
        .delete-btn:hover { background: #c0392b; }

        /* CARD FANTASMA (IN CARICAMENTO) */
        .file-card.uploading {
            background: #bdc3c7; pointer-events: none;
        }
        .file-card.uploading .icon, .file-card.uploading .name { opacity: 0.3; }
        
        /* Overlay statistiche */
        .upload-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #2c3e50; font-weight: bold; border-radius: 8px;
        }
        .animated-arrow {
            font-size: 24px;
            animation: uploadBounce 1s infinite ease-in-out;
            margin-bottom: 5px;
        }
        @keyframes uploadBounce {
            0%, 100% { transform: translateY(3px); }
            50% { transform: translateY(-3px); }
        }
        
        /* Box bianco semi-trasparente per le scritte */
        .stats { 
            font-size: 10px; background: rgba(255,255,255,0.9); 
            padding: 6px; border-radius: 6px; width: 85%; text-align: center;
            display: flex; flex-direction: column; gap: 3px;
        }
        .stats .percent { font-size: 14px; font-weight: bold; color: #2980b9; }

    </style>
</head>
<body>

    <div class="text-section">
        <textarea id="shared-textarea" placeholder="Scrivi qui..."></textarea>
    </div>

    <div class="toolbar">
        <input type="file" id="file-input">
    </div>

    <div class="files-section" id="files-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const textarea = document.getElementById('shared-textarea');
        const fileInput = document.getElementById('file-input');
        const filesContainer = document.getElementById('files-container');

        // Helper: Converti byte in KB, MB ecc.
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        // Helper: Emoji per tipo file
        function getIcon(filename) {
            if (filename.match(/\.(jpg|jpeg|png|gif)$/i)) return '🖼️';
            if (filename.match(/\.(mp4|mov|avi)$/i)) return '🎥';
            if (filename.match(/\.(zip|rar)$/i)) return '🗜️';
            return '📄';
        }

        // --- GESTIONE TESTO ---
        socket.on('init_text', (text) => textarea.value = text);
        socket.on('text_update', (text) => textarea.value = text);
        textarea.addEventListener('input', (e) => socket.emit('text_change', e.target.value));

        // --- GESTIONE FILE: RICEZIONE INIZIALE ---
        socket.on('init_files', (files) => {
            filesContainer.innerHTML = '';
            files.forEach(renderFileCard);
        });

        // --- GESTIONE FILE: CARTA FANTASMA ---
        function createGhostCard(data) {
            const card = document.createElement('div');
            card.className = 'file-card uploading';
            card.id = `ghost-${data.tempId}`;

            card.innerHTML = `
                <div class="icon">${getIcon(data.name)}</div>
                <div class="name">${data.name}</div>
                <div class="upload-overlay">
                    <div class="animated-arrow">⬆️</div>
                    <div class="stats">
                        <div class="percent" id="percent-${data.tempId}">0%</div>
                        <div class="transfer" id="transfer-${data.tempId}">0 B / ${formatBytes(data.size)}</div>
                        <div class="speed" id="speed-${data.tempId}">Calcolo...</div>
                    </div>
                </div>
            `;
            filesContainer.prepend(card);
        }

        socket.on('upload_started', createGhostCard);

        // Quando qualcuno aggiorna il progresso, aggiorniamo l'interfaccia
        socket.on('upload_progress', (data) => {
            const percentEl = document.getElementById(`percent-${data.tempId}`);
            const transferEl = document.getElementById(`transfer-${data.tempId}`);
            const speedEl = document.getElementById(`speed-${data.tempId}`);

            if (percentEl) percentEl.textContent = `${data.percent}%`;
            if (transferEl) transferEl.textContent = `${data.loadedText} / ${data.totalText}`;
            if (speedEl) speedEl.textContent = data.speed;
        });

        socket.on('new_file', (fileInfo) => {
            const ghost = document.getElementById(`ghost-${fileInfo.tempId}`);
            if (ghost) ghost.remove();
            renderFileCard(fileInfo);
        });

        socket.on('file_deleted', (fileId) => {
            const card = document.getElementById(`file-${fileId}`);
            if (card) card.remove();
        });


        // --- LOGICA DI UPLOAD DA PARTE NOSTRA ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const tempId = 'temp_' + Date.now();
            const startData = { tempId, name: file.name, size: file.size };
            
            createGhostCard(startData);
            socket.emit('upload_started', startData);

            const formData = new FormData();
            formData.append('tempId', tempId); 
            formData.append('file', file);

            const xhr = new XMLHttpRequest();
            
            let lastLoadedBytes = 0;
            let lastTime = Date.now();
            let currentSpeedText = "Calcolo..."; // Velocità base

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const now = Date.now();
                    const timeDiff = (now - lastTime) / 1000;

                    // 1. Calcoliamo la VELOCITÀ solo ogni mezzo secondo per evitare sfarfallii
                    if (timeDiff > 0.5) {
                        const bytesDiff = event.loaded - lastLoadedBytes;
                        const speedBps = bytesDiff / timeDiff;
                        currentSpeedText = formatBytes(speedBps) + '/s';

                        lastLoadedBytes = event.loaded;
                        lastTime = now;
                    }

                    // 2. Calcoliamo PERCENTUALE e TRASFERIMENTO istantaneamente
                    const percent = Math.round((event.loaded / event.total) * 100);
                    const loadedText = formatBytes(event.loaded);
                    const totalText = formatBytes(event.total);

                    // 3. Aggiorniamo la NOSTRA carta fantasma
                    const percentEl = document.getElementById(`percent-${tempId}`);
                    const transferEl = document.getElementById(`transfer-${tempId}`);
                    const speedEl = document.getElementById(`speed-${tempId}`);
                    
                    if (percentEl) percentEl.textContent = `${percent}%`;
                    if (transferEl) transferEl.textContent = `${loadedText} / ${totalText}`;
                    if (speedEl) speedEl.textContent = currentSpeedText;

                    // 4. Trasmettiamo tutti i dati aggregati agli ALTRI socket
                    socket.emit('upload_progress', { 
                        tempId, 
                        percent,
                        loadedText,
                        totalText,
                        speed: currentSpeedText 
                    });
                }
            };

            xhr.onload = () => { fileInput.value = ''; };
            xhr.open('POST', '/upload', true);
            xhr.send(formData);
        });

        // --- CARTA DEFINITIVA ---
        function renderFileCard(fileInfo) {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.id = `file-${fileInfo.id}`;

            const link = document.createElement('a');
            link.href = fileInfo.url;
            link.download = fileInfo.name; // Forza il download come richiesto!
            link.style.textDecoration = 'none'; link.style.color = 'inherit';
            link.innerHTML = `
                <div class="icon">${getIcon(fileInfo.name)}</div>
                <div class="name">${fileInfo.name}</div>
            `;

            const deleteBtn = document.createElement('div');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.onclick = (e) => {
                e.preventDefault();
                if (confirm(`Vuoi eliminare ${fileInfo.name}?`)) {
                    socket.emit('delete_file', fileInfo.id);
                }
            };

            card.appendChild(link);
            card.appendChild(deleteBtn);
            filesContainer.prepend(card); 
        }
    </script>
</body>
</html>
